services:
  postgres:
    image: postgres:16-alpine
    container_name: divisas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: divisas
      POSTGRES_PASSWORD: divisas_dev
      POSTGRES_DB: divisas
    ports:
      - "5433:5432"
    volumes:
      - divisas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U divisas -d divisas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  divisas_pgdata:
